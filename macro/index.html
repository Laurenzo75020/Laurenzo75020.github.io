  <style>
    :root{ --bg:#ffffff; --ink:#0a0a0a; --grey:#888; --line:rgba(0,0,0,0.08); --gap:40px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--bg); color:var(--ink); font-family:'Barlow', sans-serif; }
    .menu{ position:fixed; top:calc(1.4rem + env(safe-area-inset-top)); right:calc(2rem + env(safe-area-inset-right)); z-index:200; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.5rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .menu a{ color:var(--ink); text-decoration:none; opacity:.9; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); transition:opacity .2s; }
    .menu a:hover{ opacity:1; }
    /* compositions imbriquées (voir le script) : les images sont posées à leur place exacte dans chaque bloc */
    .mur{ display:flex; flex-direction:column; gap:var(--gap); padding:calc(9rem + env(safe-area-inset-top)) 2rem 5rem; }
    .bloc{ position:relative; }
    .bloc video{ position:absolute; display:block; object-fit:cover; }
    .bloc img{ position:absolute; display:block; cursor:zoom-in; -webkit-user-drag:none; user-select:none; }
    .bas{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.6rem; padding:0 2rem 3rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .bas a{ color:var(--ink); text-decoration:none; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); }
    footer{ padding:1.5rem 2rem 2.5rem; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); }
    /* 25 nov. 2026 : visionneuse en carrousel, posée en voile clair sur la page (avant : fond noir, une image seule).
       Chaque image occupe 80 % de la largeur : on voit les voisines sur 10 % à gauche et à droite. */
    .lightbox{ position:fixed; inset:0; z-index:500; background:rgba(255,255,255,.8); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); display:none; overflow:hidden; touch-action:none; }
    .lightbox.open{ display:block; }
    .lb-piste{ position:absolute; top:0; left:0; height:100%; display:flex; will-change:transform; }
    .lb-piste.anime{ transition:transform .4s cubic-bezier(.25,.46,.45,.94); }
    .lb-case{ width:80vw; height:100%; flex:none; display:flex; align-items:center; justify-content:center; padding:0 1.2vw; box-sizing:border-box; }
    .lb-case img{ max-width:100%; max-height:84vh; display:block; box-shadow:0 18px 50px rgba(0,0,0,.25); opacity:.45; transition:opacity .4s; -webkit-user-drag:none; user-select:none; cursor:pointer; }
    .lb-case.ici img{ opacity:1; cursor:default; }
    .lb-fermer{ position:absolute; top:1.1rem; right:1.4rem; z-index:2; background:none; border:none; font:inherit; font-weight:600; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); cursor:pointer; padding:.5rem; }
    .lb-fl{ position:absolute; top:50%; transform:translateY(-50%); z-index:2; background:rgba(255,255,255,.85); border:none; width:44px; height:44px; border-radius:50%; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; }
    .lb-fl.g{ left:2vw; } .lb-fl.d{ right:2vw; }
    .lb-fl[hidden]{ display:none; }
    @media (hover:none){ .lb-fl{ display:none; } }
    @media (max-width:768px){
      :root{ --gap:12px; }
      .menu{ position:static; padding:calc(1.2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) 0 0; }
      .mur{ padding:1.6rem 1rem 3rem; }
      .bas{ padding:0 1rem 2rem; }
      footer{ padding:1rem 1rem 2rem; }
    }
  </style>
  <script src="../lang.js?v=2"></script>
</head>

  <div class="lightbox" id="lb"><div class="lb-piste" id="lbPiste"></div>
    <button class="lb-fermer" id="lbFermer" data-en="Close ×">Fermer ×</button>
    <button class="lb-fl g" id="lbG" aria-label="Précédente"><svg width="20" height="20" viewBox="0 0 20 20"><polyline points="13,3 6,10 13,17" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="lb-fl d" id="lbD" aria-label="Suivante"><svg width="20" height="20" viewBox="0 0 20 20"><polyline points="7,3 14,10 7,17" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <script>
    // Compositions imbriquées, sans case blanche ni recadrage : chaque bloc remplit toute la largeur. H(...) = côte à côte
    // à la même hauteur, V(...) = empilées à la même largeur ; les tailles sont calculées pour que tout tombe juste.
    const I=(f,l,h)=>({f,l,h}), H=(...c)=>({t:'H',c}), V=(...c)=>({t:'V',c});
    const COMPO=[
      H(I('macro_20.jpg',1136,1072), I('macro_21.jpg',1312,1238)),   // 18 nov. 2026 : ligne 1 = les deux ciels bleus (vague orange + arche)
      V(H(I('macro_49.jpg',1312,928), V(I('macro_23.jpg',1534,1217), I('macro_19.jpg',1880,1090))), H(I('macro_44.jpg',843,1131), I('macro_51.jpg',1296,912))),   // 25 nov. 2026 : un seul bloc sur deux rangées : chambre rouge (49) + sac rouge (23) et route (19) superposés ; puis vague striée (44) + fumée verte (51). Salon aux nuages (50) retiré
      H(I('macro_56.jpg',1070,1367), V(I('macro_01.jpg',1352,760), I('macro_03_video.mov',1280,720))),   /* 26 nov. 2026 : le baiser aux couronnes (56) en grand à gauche, 01 et la vidéo 03 superposées à droite */   // 18 nov. 2026 : 02 retirée ; 03 remplacée par sa vidéo
      H(I('macro_04.jpg',1352,760), V(I('macro_05.jpg',1024,576), I('macro_06.jpg',1024,576))),
      H(I('macro_38.jpg',819,819), I('macro_41.jpg',819,819), I('macro_40.jpg',1024,947)),   // 23 nov. 2026 : la silhouette en fils blancs entre le pavot et la main (les trois sur fond noir)
      V(H(I('macro_26.jpg',653,1056), V(I('macro_31.jpg',1165,653), I('macro_32.jpg',1165,653)), I('macro_39.jpg',1039,620)), H(I('macro_33.jpg',1165,653), V(I('macro_30.jpg',1148,653), I('macro_35.jpg',1165,653)))),   // 24 nov. 2026 : un seul bloc de cristaux sur deux rangées : 26, 31/32, 39 ; puis la fleur sombre (33) en grand et les deux cubes bleus (30, 35) superposés
      H(V(I('macro_42.jpg',819,819), I('macro_45.jpg',1024,1024)), I('macro_24.jpg',1944,1667), I('macro_46.jpg',1024,1024)),   // 25 nov. 2026 : sculpture de câbles (48) et mer rayée (47) retirées ; silhouette voilée (42) et voile blanc (45) superposés, argent (24), cœur orange voilé (46)
      H(V(I('macro_10.jpg',1344,768), I('macro_11.jpg',1774,1014)), I('macro_12.jpg',1344,768)),   // 23 nov. 2026 : la vague striée (43) est montée en lignes 2-3
      H(V(I('macro_52.jpg',512,512), I('macro_53.jpg',512,512)), I('macro_55.jpg',1024,1024), I('macro_54.jpg',512,512)),   // 24 nov. 2026 : 52/53 superposées à gauche, le visage en lignes (55) au centre (moins grand qu'avant), la sculpture crème (54) à droite
      H(I('macro_13.jpg',1774,1014), V(I('macro_16.jpg',1344,768), I('macro_17.jpg',1774,1014)), I('macro_14.jpg',1344,768)),   // 24 nov. 2026 : 16 et 17 revenus en bas de page, superposés entre la sculpture tigrée (13) et le verre irisé (14)
    ];
    const mur=document.getElementById('mur'), lb=document.getElementById('lb');
    // largeur d'un bloc en fonction de sa hauteur : w = a*h + b (b vient des filets entre images)
    function lin(n,g){
      if(!n.t) return {a:n.l/n.h, b:0};
      const k=n.c.map(c=>lin(c,g));
      if(n.t==='H') return {a:k.reduce((s,x)=>s+x.a,0), b:k.reduce((s,x)=>s+x.b,0)+(k.length-1)*g};
      const S=k.reduce((s,x)=>s+1/x.a,0);
      return {a:1/S, b:(k.reduce((s,x)=>s+x.b/x.a,0)-(k.length-1)*g)/S};
    }
    function poser(n,x,y,w,h,g,sortie){
      if(!n.t){ sortie.push([n,x,y,w,h]); return; }
      const k=n.c.map(c=>lin(c,g));
      if(n.t==='H'){ let cx=x; n.c.forEach((c,i)=>{ const cw=(i===n.c.length-1)? x+w-cx : k[i].a*h+k[i].b; poser(c,cx,y,cw,h,g,sortie); cx+=cw+g; }); }
      else { let cy=y; n.c.forEach((c,i)=>{ const ch=(i===n.c.length-1)? y+h-cy : (w-k[i].b)/k[i].a; poser(c,x,cy,w,ch,g,sortie); cy+=ch+g; }); }
    }
    const images=new Map();
    function image(n){
      if(images.has(n)) return images.get(n);
      if(/\.mov$/.test(n.f)){   // vidéo : lecture en boucle, sans son, comme une image animée
        const v=document.createElement('video'); v.src='images/'+n.f+'?v=2'; v.muted=true; v.loop=true; v.autoplay=true; v.playsInline=true;
        v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.preload='metadata'; v.width=n.l; v.height=n.h;
        images.set(n,v); return v;
      }
      const im=document.createElement('img'); im.alt=''; im.width=n.l; im.height=n.h; im.loading='lazy'; im.decoding='async';   // chargement au fil du défilement (avant, cette ligne était cachée dans le commentaire : tout se chargeait d'un coup)
      im.src='images/'+n.f+'?v=5';      // ?v=N : à augmenter à chaque nouvelle sélection (les noms de fichiers sont repris)
      im.addEventListener('click',()=>ouvrirCarrousel(im));
      let essais=0; im.addEventListener('error',()=>{ if(essais++<3) setTimeout(()=>{ im.src='images/'+n.f+'?v=5&r='+essais; },800*essais); });   // 25 nov. 2026 : si une image échoue au chargement (vu sur macro_30 chez Laurent), on réessaie jusqu'à 3 fois
      images.set(n,im); return im;
    }
    function mettreEnPage(){
      const g=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||40;
      const W=mur.clientWidth-parseFloat(getComputedStyle(mur).paddingLeft)-parseFloat(getComputedStyle(mur).paddingRight);
      // téléphone : même mise en page « Tetris » que sur ordinateur, réduite (18 nov. 2026 ; avant : une image par ligne)
      const blocs=COMPO;
      mur.textContent='';
      blocs.forEach(b=>{
        const Wb=W*(b.larg||1);   // larg : rangée plus étroite que la page, centrée
        const k=lin(b,g), h=(Wb-k.b)/k.a, d=document.createElement('div'); d.className='bloc'; d.style.height=h+'px'; d.style.width=Wb+'px'; d.style.margin='0 auto';
        const sortie=[]; poser(b,0,0,Wb,h,g,sortie);
        sortie.forEach(([n,x,y,w,hh])=>{ const im=image(n); Object.assign(im.style,{left:x+'px',top:y+'px',width:w+'px',height:hh+'px'}); d.appendChild(im); if(im.play) im.play().catch(()=>{}); });
        mur.appendChild(d);
      });
    }
    mettreEnPage();
    let attente; window.addEventListener('resize',()=>{ clearTimeout(attente); attente=setTimeout(mettreEnPage,100); });
    // ---- Carrousel (25 nov. 2026) : toutes les images de la page, dans l'ordre, sans la vidéo ; s'arrête aux deux bouts ----
    const piste=document.getElementById('lbPiste'), flG=document.getElementById('lbG'), flD=document.getElementById('lbD');
    let liste=[], ici=0;
    const larg=()=>window.innerWidth*0.8, depart=()=>window.innerWidth*0.1;
    function placer(dx,anime){ piste.classList.toggle('anime',!!anime); piste.style.transform='translateX('+(depart()-ici*larg()+(dx||0))+'px)'; }
    function charger(){ [...piste.children].forEach((c,i)=>{ const im=c.firstChild; if(Math.abs(i-ici)<=2 && !im.src) im.src=liste[i]; }); }
    function aller(n){ ici=Math.max(0,Math.min(liste.length-1,n)); [...piste.children].forEach((c,i)=>c.classList.toggle('ici',i===ici)); charger(); placer(0,true); flG.hidden=ici===0; flD.hidden=ici===liste.length-1; }
    function ouvrirCarrousel(im){
      const tous=[...mur.querySelectorAll('img')]; liste=tous.map(x=>x.src); piste.textContent='';
      liste.forEach((_,i)=>{ const c=document.createElement('div'); c.className='lb-case'; const m=document.createElement('img'); m.alt='';
        m.addEventListener('click',e=>{ e.stopPropagation(); if(i!==ici) aller(i); }); c.appendChild(m); piste.appendChild(c); });
      ici=tous.indexOf(im); lb.classList.add('open'); document.documentElement.style.overflow='hidden'; placer(0,false); aller(ici);
    }
    function fermer(){ lb.classList.remove('open'); document.documentElement.style.overflow=''; piste.textContent=''; }
    lb.addEventListener('click',e=>{ if(Date.now()-glisseFin<400) return; if(e.target===lb || e.target.classList.contains('lb-case')) fermer(); });
    document.getElementById('lbFermer').addEventListener('click',e=>{ e.stopPropagation(); fermer(); });
    flG.addEventListener('click',e=>{ e.stopPropagation(); aller(ici-1); });
    flD.addEventListener('click',e=>{ e.stopPropagation(); aller(ici+1); });
    document.addEventListener('keydown',e=>{ if(!lb.classList.contains('open')) return; if(e.key==='Escape') fermer(); if(e.key==='ArrowLeft') aller(ici-1); if(e.key==='ArrowRight') aller(ici+1); });
    // le doigt fait glisser la piste en direct ; au lâcher, elle se cale sur l'image la plus proche (aux bouts, elle résiste)
    let x0=0, y0=0, dx=0, suit=false, glisseFin=0;
    lb.addEventListener('touchstart',e=>{ if(e.touches.length!==1) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; suit=true; },{passive:true});
    lb.addEventListener('touchmove',e=>{ if(!suit) return; dx=e.touches[0].clientX-x0; if((ici===0&&dx>0)||(ici===liste.length-1&&dx<0)) dx/=3; placer(dx,false); e.preventDefault(); },{passive:false});
    lb.addEventListener('touchend',()=>{ if(!suit) return; suit=false; if(Math.abs(dx)>10) glisseFin=Date.now(); const seuil=larg()*0.15; aller(dx<-seuil?ici+1:dx>seuil?ici-1:ici); });
    window.addEventListener('resize',()=>{ if(lb.classList.contains('open')) placer(0,false); });
  </script>
  <script src="/image-protection.js"></script>
