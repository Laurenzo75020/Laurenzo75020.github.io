<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Bourdoiseau — Santé mentale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#ffffff; --ink:#0a0a0a; --grey:#888; --line:rgba(0,0,0,0.08); --gap:40px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--bg); color:var(--ink); font-family:'Barlow', sans-serif; }
    .menu{ position:fixed; top:calc(1.4rem + env(safe-area-inset-top)); right:calc(2rem + env(safe-area-inset-right)); z-index:200; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.5rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .menu a{ color:var(--ink); text-decoration:none; opacity:.9; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); transition:opacity .2s; }
    .menu a:hover{ opacity:1; }
    /* rangées : une image seule en pleine largeur, ou deux images de même forme, à la même hauteur, sans recadrage */
    .mur{ display:flex; flex-direction:column; gap:var(--gap); padding:calc(9rem + env(safe-area-inset-top)) 2rem 5rem; }
    .rang{ display:flex; gap:var(--gap); }
    .rang img{ display:block; min-width:0; width:0; height:auto; cursor:zoom-in; -webkit-user-drag:none; user-select:none; }
    .bas{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.6rem; padding:0 2rem 3rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .bas a{ color:var(--ink); text-decoration:none; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); }
    footer{ padding:1.5rem 2rem 2.5rem; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); }
    .lightbox{ position:fixed; inset:0; z-index:500; background:rgba(10,10,10,.86); display:none; align-items:center; justify-content:center; padding:6vh 6vw; cursor:zoom-out; }
    .lightbox.open{ display:flex; }
    .lightbox img{ max-width:88vw; max-height:88vh; display:block; box-shadow:0 20px 60px rgba(0,0,0,.5); -webkit-user-drag:none; user-select:none; }
    @media (max-width:768px){
      :root{ --gap:12px; }
      .menu{ position:static; padding:calc(1.2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) 0 0; }
      .mur{ padding:1.6rem 1rem 3rem; }
      .rang{ flex-direction:column; }
      .rang img{ width:100% !important; flex:none !important; }
      .bas{ padding:0 1rem 2rem; }
      footer{ padding:1rem 1rem 2rem; }
    }
  </style>
  <script src="../lang.js?v=2"></script>
</head>
<body>
  <div class="menu">
    <a href="../index.html?accueil" data-en="← Home">← Accueil</a>
    <a href="../photos/">Photo</a>
    <a href="../portfolio/?from=sante">Portfolio</a>
    <a href="../ia/" data-en="AI">IA</a>
    <a href="../macro/" data-en="AI Macro">Macro IA</a>
    <a href="../serie/" data-en="Bombek">Bombek</a>
    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" data-en="Mental health">Santé mentale</a>
  </div>
  <main class="mur" id="mur" aria-label="Santé mentale"></main>
  <div class="bas">
    <a href="../index.html?accueil" data-en="← Home">← Accueil</a>
    <a href="../photos/">Photo</a>
    <a href="../portfolio/?from=sante">Portfolio</a>
    <a href="../ia/" data-en="AI">IA</a>
    <a href="../macro/" data-en="AI Macro">Macro IA</a>
    <a href="../serie/" data-en="Bombek">Bombek</a>
    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" data-en="Mental health">Santé mentale</a>
  </div>
  <footer>© 2026 Laurent Bourdoiseau</footer>
  <div class="lightbox" id="lb"><img id="lbImg" src="" alt=""></div>
  <script>
    // Chaque ligne est une rangée : [fichier, largeur, hauteur]. Ajouter une image = ajouter une entrée ici.
    const RANGS=[
      [['sante_64.jpg',1774,1014],['sante_21.jpg',1344,768]],
      [['sante_49.jpg',1774,1014],['sante_47.jpg',1774,1014]],
      [['sante_43.jpg',1774,1014],['sante_60.jpg',1774,1014]],
      [['sante_45.jpg',1774,1014],['sante_57.jpg',1774,1014]],
      [['sante_62.jpg',1774,1014],['sante_48.jpg',1774,1014]],
      [['sante_53.jpg',1774,1014],['sante_22.jpg',1344,768]],
      [['sante_51.jpg',1774,1014],['sante_42.jpg',1774,1014]],
      [['sante_61.jpg',1774,1014],['sante_50.jpg',1774,1014]],
      [['sante_46.jpg',1774,1014],['sante_58.jpg',1774,1014]],
      [['sante_52.jpg',1774,1014],['sante_54.jpg',1774,1014]],
      [['sante_55.jpg',1774,1014],['sante_56.jpg',1774,1014]],
    ];
    const mur=document.getElementById('mur'), lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
    RANGS.forEach(r=>{
      const d=document.createElement('div'); d.className='rang';
      r.forEach(([f,l,h])=>{
        const im=document.createElement('img'); im.src='images/'+f; im.alt=''; im.width=l; im.height=h; im.loading='lazy';
        im.style.flex=(l/h)+' 1 0';       // même hauteur dans la rangée, sans recadrer
        im.addEventListener('click',()=>{ lbImg.src=im.src; lb.classList.add('open'); });
        d.appendChild(im);
      });
      mur.appendChild(d);
    });
    lb.addEventListener('click',()=>{ lb.classList.remove('open'); lbImg.src=''; });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') lb.click(); });
  </script>
  <script src="/image-protection.js"></script>
</body>
</html>
