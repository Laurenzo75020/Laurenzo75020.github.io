  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#ffffff; --ink:#0a0a0a; --grey:#888; --line:rgba(0,0,0,0.08); --gap:40px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--bg); color:var(--ink); font-family:'Barlow', sans-serif; }
    .menu{ position:fixed; top:calc(1.4rem + env(safe-area-inset-top)); right:calc(2rem + env(safe-area-inset-right)); z-index:200; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.5rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .menu a{ color:var(--ink); text-decoration:none; opacity:.9; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); transition:opacity .2s; }
    .menu a:hover{ opacity:1; }
    /* « Tirages éparpillés » (adopté le 6 novembre 2026) : chaque image est un tirage papier (marge blanche, un peu plus large en bas),
       de taille variable, légèrement de travers, qui chevauche ses voisins sur les bords, avec une ombre douce.
       Au survol, le tirage passe au-dessus et se redresse ; un clic l'agrandit. */
    .mur{ padding:calc(9rem + env(safe-area-inset-top)) 3vw 6rem; max-width:1500px; margin:0 auto; }
    .rang{ display:flex; justify-content:center; align-items:flex-start; position:relative; }
    .tirage{ position:relative; background:#fbfaf5; box-shadow:0 1px 3px rgba(0,0,0,.18), 0 14px 32px rgba(0,0,0,.20);
      transform:translateY(var(--y)) rotate(var(--r)); transition:transform .35s ease, box-shadow .35s ease; cursor:zoom-in; }
    .tirage:hover{ z-index:50; transform:translateY(var(--y)) rotate(0deg) scale(1.03); box-shadow:0 2px 6px rgba(0,0,0,.2), 0 24px 50px rgba(0,0,0,.28); }
    .tirage img{ display:block; width:100%; height:auto; -webkit-user-drag:none; user-select:none; }
    .bas{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.6rem; padding:0 2rem 3rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .bas a{ color:var(--ink); text-decoration:none; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); }
    footer{ padding:1.5rem 2rem 2.5rem; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); }
    .lightbox{ position:fixed; inset:0; z-index:500; background:rgba(10,10,10,.86); display:none; align-items:center; justify-content:center; padding:6vh 6vw; cursor:zoom-out; }
    .lightbox.open{ display:flex; }
    .lightbox img{ max-width:88vw; max-height:88vh; display:block; box-shadow:0 20px 60px rgba(0,0,0,.5); -webkit-user-drag:none; user-select:none; }
    @media (max-width:768px){
      :root{ --gap:12px; }
      .menu{ position:static; padding:calc(1.2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) 0 0; }
      /* même mise en page que sur ordinateur (tirages côte à côte qui se chevauchent), un peu plus grande pour le téléphone */
      .mur{ padding:2.2rem .4rem 3rem; }
      .rang{ margin-top:-3vw !important; }
      .rang:first-child{ margin-top:0 !important; }
      .tirage{ transform:translateY(var(--y)) rotate(var(--r)) scale(1.12); }
      .bas{ padding:0 1rem 2rem; }
      footer{ padding:1rem 1rem 2rem; }
    }
  </style>
  <script src="../lang.js?v=2"></script>
</head>

  <div class="lightbox" id="lb"><img id="lbImg" src="" alt=""></div>
  <script>
    // Même ordre que la vraie page. Rangées alternées de 2 et 3 tirages, largeurs variées (en % de la page).
    const IMAGES=[
      ['sante_53.jpg',1774,1014],
      ['sante_21.jpg',1344,768],
      ['sante_60.jpg',1774,1014],
      ['sante_46.jpg',1774,1014],
      ['sante_66.jpg',1774,964],
      ['sante_22.jpg',1344,768],
      ['sante_43.jpg',1774,1014],
      ['sante_45.jpg',1774,1014],
      ['sante_64.jpg',1774,1014],
      ['sante_57.jpg',1774,1014],
      ['sante_51.jpg',1774,1014],
      ['sante_42.jpg',1774,1014],
      ['sante_58.jpg',1774,1014],
      ['sante_55.jpg',1774,1014],
      ['sante_54.jpg',1774,1014],
      ['sante_67.jpg',1646,951],
      ['sante_65.jpg',1774,1014]
    ];
    const MOTIFS=[[46,36],[30,38,28],[36,48],[34,27,33]];
    const mur=document.getElementById('mur'), lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
    let n=0, m=0;
    while(n<IMAGES.length){
      let motif=MOTIFS[m++ % MOTIFS.length];
      const reste=IMAGES.length-n;
      if(reste<motif.length) motif=reste===1?[60]:[44,40];
      const d=document.createElement('div'); d.className='rang';
      d.style.marginTop = m===1 ? '0' : '-2.2vw';            // les rangées se chevauchent un peu
      motif.forEach((w,k)=>{
        const [f,l,h]=IMAGES[n];
        const t=document.createElement('div'); t.className='tirage';
        const marge=w*0.032;                                  // marge blanche proportionnelle à la taille du tirage
        t.style.width=w+'%'; t.style.padding=marge+'vw '+marge+'vw '+(marge*2.2)+'vw';
        if(k>0) t.style.marginLeft='-3%';                     // chevauchement sur les bords
        const r=(((n*37+11)%9)-4)*0.75;                       // inclinaison de -3° à +3°, toujours la même
        const y=(((n*53+7)%7)-3)*0.9;                         // petit décalage vertical
        t.style.setProperty('--r', r+'deg'); t.style.setProperty('--y', y+'vw');
        t.style.zIndex = 1 + ((n*29)%5);
        const im=document.createElement('img'); im.src='images/'+f; im.alt=''; im.width=l; im.height=h; im.loading='lazy';
        t.appendChild(im);
        t.addEventListener('click',()=>{ lbImg.src=im.src; lb.classList.add('open'); });
        d.appendChild(t); n++;
      });
      mur.appendChild(d);
    }
    lb.addEventListener('click',()=>{ lb.classList.remove('open'); lbImg.src=''; });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') lb.click(); });
  </script>
  <script src="/image-protection.js"></script>
