<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Bourdoiseau — Santé mentale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#ffffff; --ink:#0a0a0a; --grey:#888; --line:rgba(0,0,0,0.08); --gap:40px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--bg); color:var(--ink); font-family:'Barlow', sans-serif; }
    .menu{ position:fixed; top:calc(1.4rem + env(safe-area-inset-top)); right:calc(2rem + env(safe-area-inset-right)); z-index:200; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.5rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .menu a{ color:var(--ink); text-decoration:none; opacity:.9; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); transition:opacity .2s; }
    .menu a:hover{ opacity:1; }
    /* compositions imbriquées (voir le script) : les images sont posées à leur place exacte dans chaque bloc */
    .mur{ display:flex; flex-direction:column; gap:var(--gap); padding:calc(9rem + env(safe-area-inset-top)) 2rem 5rem; }
    .bloc{ position:relative; }
    .bloc img{ position:absolute; display:block; cursor:zoom-in; -webkit-user-drag:none; user-select:none; }
    .bas{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.6rem; padding:0 2rem 3rem; font-weight:600; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; }
    .bas a{ color:var(--ink); text-decoration:none; background:rgba(255,255,255,.95); padding:.35rem .7rem; box-shadow:0 1px 4px rgba(0,0,0,.12); }
    footer{ padding:1.5rem 2rem 2.5rem; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); }
    .lightbox{ position:fixed; inset:0; z-index:500; background:rgba(10,10,10,.86); display:none; align-items:center; justify-content:center; padding:6vh 6vw; cursor:zoom-out; }
    .lightbox.open{ display:flex; }
    .lightbox img{ max-width:88vw; max-height:88vh; display:block; box-shadow:0 20px 60px rgba(0,0,0,.5); -webkit-user-drag:none; user-select:none; }
    @media (max-width:768px){
      :root{ --gap:12px; }
      .menu{ position:static; padding:calc(1.2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right)) 0 0; }
      .mur{ padding:1.6rem 1rem 3rem; }
      .bas{ padding:0 1rem 2rem; }
      footer{ padding:1rem 1rem 2rem; }
    }
  </style>
  <script src="../lang.js?v=2"></script>
</head>
<body>

  <main class="mur" id="mur" aria-label="Santé mentale"></main>
  <div class="bas">
    <a href="../index.html?accueil" data-en="← Home">← Accueil</a>
    <a href="../photos/">Photo</a>
    <a href="../portfolio/?from=sante">Portfolio</a>

  </div>
  <footer>© 2026 Laurent Bourdoiseau</footer>
  <div class="lightbox" id="lb"><img id="lbImg" src="" alt=""></div>
  <script>
    // Compositions imbriquées, sans case blanche ni recadrage : chaque bloc remplit toute la largeur. H(...) = côte à côte
    // à la même hauteur, V(...) = empilées à la même largeur ; les tailles sont calculées pour que tout tombe juste.
    const I=(f,l,h)=>({f,l,h}), H=(...c)=>({t:'H',c}), V=(...c)=>({t:'V',c});
    const COMPO=[
      H(I('sante_64.jpg',1774,1014), V(I('sante_21.jpg',1344,768), I('sante_49.jpg',1774,1014))),
      H(V(I('sante_47.jpg',1774,1014), I('sante_43.jpg',1774,1014)), I('sante_65.jpg',1774,1014)),
      H(I('sante_60.jpg',1774,1014), V(I('sante_45.jpg',1774,1014), I('sante_57.jpg',1774,1014))),
      H(I('sante_48.jpg',1774,1014), I('sante_53.jpg',1774,1014)),
      H(I('sante_22.jpg',1344,768), I('sante_51.jpg',1774,1014)),
      H(I('sante_42.jpg',1774,1014), I('sante_50.jpg',1774,1014)),
      H(V(I('sante_46.jpg',1774,1014), I('sante_58.jpg',1774,1014)), I('sante_61.jpg',1774,1014)),
      H(I('sante_55.jpg',1774,1014), V(I('sante_52.jpg',1774,1014), I('sante_54.jpg',1774,1014))),
    ];
    const mur=document.getElementById('mur'), lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
    // largeur d'un bloc en fonction de sa hauteur : w = a*h + b (b vient des filets entre images)
    function lin(n,g){
      if(!n.t) return {a:n.l/n.h, b:0};
      const k=n.c.map(c=>lin(c,g));
      if(n.t==='H') return {a:k.reduce((s,x)=>s+x.a,0), b:k.reduce((s,x)=>s+x.b,0)+(k.length-1)*g};
      const S=k.reduce((s,x)=>s+1/x.a,0);
      return {a:1/S, b:(k.reduce((s,x)=>s+x.b/x.a,0)-(k.length-1)*g)/S};
    }
    function poser(n,x,y,w,h,g,sortie){
      if(!n.t){ sortie.push([n,x,y,w,h]); return; }
      const k=n.c.map(c=>lin(c,g));
      if(n.t==='H'){ let cx=x; n.c.forEach((c,i)=>{ const cw=(i===n.c.length-1)? x+w-cx : k[i].a*h+k[i].b; poser(c,cx,y,cw,h,g,sortie); cx+=cw+g; }); }
      else { let cy=y; n.c.forEach((c,i)=>{ const ch=(i===n.c.length-1)? y+h-cy : (w-k[i].b)/k[i].a; poser(c,x,cy,w,ch,g,sortie); cy+=ch+g; }); }
    }
    const images=new Map();
    function image(n){
      if(images.has(n)) return images.get(n);
      const im=document.createElement('img'); im.src='images/'+n.f; im.alt=''; im.width=n.l; im.height=n.h; im.loading='lazy';
      im.addEventListener('click',()=>{ lbImg.src=im.src; lb.classList.add('open'); });
      images.set(n,im); return im;
    }
    function mettreEnPage(){
      const g=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||40;
      const W=mur.clientWidth-parseFloat(getComputedStyle(mur).paddingLeft)-parseFloat(getComputedStyle(mur).paddingRight);
      const mobile=window.matchMedia('(max-width:768px)').matches;
      // sur téléphone : une image par ligne, dans le même ordre
      const blocs=mobile ? [V(...COMPO.flatMap(function plat(n){ return n.t ? n.c.flatMap(plat) : [n]; }))] : COMPO;
      mur.textContent='';
      blocs.forEach(b=>{
        const k=lin(b,g), h=(W-k.b)/k.a, d=document.createElement('div'); d.className='bloc'; d.style.height=h+'px';
        const sortie=[]; poser(b,0,0,W,h,g,sortie);
        sortie.forEach(([n,x,y,w,hh])=>{ const im=image(n); Object.assign(im.style,{left:x+'px',top:y+'px',width:w+'px',height:hh+'px'}); d.appendChild(im); });
        mur.appendChild(d);
      });
    }
    mettreEnPage();
    let attente; window.addEventListener('resize',()=>{ clearTimeout(attente); attente=setTimeout(mettreEnPage,100); });
    lb.addEventListener('click',()=>{ lb.classList.remove('open'); lbImg.src=''; });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') lb.click(); });
  </script>
  <script src="/image-protection.js"></script>
</body>
</html>
