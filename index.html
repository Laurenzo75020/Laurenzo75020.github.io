<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- barre du navigateur (téléphone) : blanche, et non teintée par le bleu du haut de la photo -->
<meta name="theme-color" content="#ffffff">
<title>Laurent Bourdoiseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Barlow+Condensed:wght@300;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#ffffff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  body{
    width:100%;
    background:#0a0a0a;
    color:var(--ink);
    font-family:'Fraunces', serif;
    cursor:default;
  }

  #scenes{
    position:fixed;
    inset:0;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }

  .scene{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    scroll-snap-align:start;
    scroll-snap-stop:always;
  }

  .bg-half{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  /* Accueil, image seule : l'image est calée par le bas et agrandie pour que le haut des sourcils
     tombe juste sous la ligne de base du nom, quelle que soit la taille de l'écran.
     0.2308 = hauteur du haut des sourcils dans l'image (fraction) ; 0.84 = ligne de base du nom
     depuis le haut de son bloc (en corps) ; 0.12 = petit espace entre la base du nom et les sourcils, plus 20 px demandés ensuite. */
  @media (orientation:landscape){
    .scene.still{
      --fs:clamp(2.6rem, 5.85vw, 6.5rem);
      --brow-y:calc(3.4rem + env(safe-area-inset-top) + var(--fs) * (0.84 + 0.12) + 20px);
    }
    .scene.still .bg-half{
      inset:auto;
      left:0;
      bottom:0;
      width:100%;
      height:calc((100vh - var(--brow-y)) / (1 - 0.2308));
      object-position:center top;
    }
  }

  /* Accueil, photo plein écran (la colonne et le génie). L'image n'est pas centrée : elle est calée pour que le haut du
     génie (l'aile, à 35,3 % de la hauteur de l'image et 44,7 % de sa largeur) tombe juste sous le nom, à la hauteur --gy.
     Elle est agrandie au besoin pour couvrir toute la fenêtre jusqu'en bas. 0.8381 = hauteur / largeur de l'image. */
  .scene.still.plein{
    --fs:clamp(2.6rem, 5.85vw, 6.5rem);
    --gy:calc(3.4rem + env(safe-area-inset-top) + var(--fs) * (0.84 + 0.12) + 42px);       /* ordinateur : sous la ligne de base du nom */
    --gx:38vw;                                                                               /* place du génie dans la largeur */
    /* assez large pour couvrir la fenêtre à gauche, à droite et jusqu'en bas */
    --iw:max(calc(var(--gx) / 0.447), calc((100vw - var(--gx)) / 0.553), calc((100vh - var(--gy)) / 0.655 * 1.1932));
  }
  @media (orientation:portrait){
    /* téléphone : sous les deux lignes du nom et le menu */
    .scene.still.plein{ --gy:calc(1.6rem + env(safe-area-inset-top) + 2.3 * clamp(1.8rem, 8vw, 3rem) + 2.1rem); --gx:39vw; }
  }
  /* La photo est peinte en fond d'un bloc qui s'arrête exactement aux bords de la fenêtre : aucun élément ne dépasse
     au-dessus de l'écran (sur téléphone, une image qui dépassait en haut teintait en bleu la barre du navigateur). */
  .scene.still.plein .bg-half{ display:none; }
  .scene.still.plein::before{
    content:""; position:absolute; inset:0;
    background-image:url(accueil-colonne.jpg); background-repeat:no-repeat;
    background-size:var(--iw) calc(var(--iw) * 0.8381);
    background-position:calc(var(--gx) - var(--iw) * 0.447) calc(var(--gy) - var(--iw) * 0.8381 * 0.345);
  }
  .scene.still.plein .signature{ color:#fff; }

  .scrub-img{ opacity:0; }
  .scrub-img.on{ opacity:1; }

  .shutter-line.scrub-line{ left:25%; }

  .bg-l{ clip-path:inset(0 50% 0 0); }
  .bg-r{ clip-path:inset(0 0 0 50%); }

  @media (orientation:portrait){
    .bg-half{ object-fit:contain; }
  }

  .scene.snap-back .bg-l,
  .scene.snap-back .bg-r{ transition:clip-path 0.6s ease; }

  .shutter-line{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:2px;
    margin-left:-1px;
    background:rgba(255,255,255,0.85);
    box-shadow:0 0 12px rgba(0,0,0,0.35);
    z-index:1;
    pointer-events:none;
  }

  .scene.snap-back .shutter-line{ transition:left 0.6s ease; }

  /* indice de scroll masqué tant que l'accueil n'a qu'une seule image (à retirer si la série revient) */
  .scroll-hint{ display:none !important; }
  .scroll-hint-ancien{
    position:fixed;
    left:75%;
    bottom:calc(4.6rem + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:2;
    opacity:1;
    transition:opacity 0.5s ease;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.4rem;
  }

  .scroll-hint .label{
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size:0.8rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.45);
  }

  .scroll-hint svg{
    display:block;
    animation:hint-bounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.45));
  }

  @keyframes hint-bounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(8px); }
  }

  .signature{
    position:absolute;
    top:calc(3.4rem + env(safe-area-inset-top));
    left:2.2rem;
    right:2.2rem;
    min-height:2.2rem;
    z-index:2;
    display:flex;
    align-items:center;
    text-align:left;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:900;
    font-size:clamp(2.6rem, 5.85vw, 6.5rem);
    line-height:0.88;
    letter-spacing:0.04em;
    text-transform:uppercase;
    opacity:1;
    pointer-events:none;
  }

  nav.choice{
    position:fixed;
    /* le haut du premier onglet s'aligne sur le haut des capitales du nom (qui sont 0,1365 corps sous le haut de leur bloc) */
    top:calc(3.4rem + env(safe-area-inset-top) + 0.1365 * clamp(2.6rem, 5.85vw, 6.5rem));
    right:calc(2rem + env(safe-area-inset-right));
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1rem;
  }

  nav.choice a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.9;
    transition:opacity 0.2s ease;
    white-space:nowrap;
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:rgba(255,255,255,0.95);
    color:#0a0a0a;
    padding:0.5rem 1rem;
    box-shadow:0 1px 4px rgba(0,0,0,0.12);
  }

  nav.choice a:hover{
    opacity:1;
  }

  @media (max-width:560px){
    .signature{ top:calc(1.6rem + env(safe-area-inset-top)); left:1.4rem; right:auto; width:min-content; font-size:clamp(1.8rem, 8vw, 3rem); line-height:1.15; }
    nav.choice{
      top:calc(1.6rem + env(safe-area-inset-top) + 0.267 * clamp(1.8rem, 8vw, 3rem));   /* même alignement, nom sur deux lignes */
      bottom:auto;
      right:1.4rem;
      gap:0.6rem;
    }
    nav.choice a{
      font-size:0.85rem;
      padding:0.35rem 0.7rem;
    }
    .scroll-hint{ left:50%; transform:translateX(-50%); bottom:calc(3.2rem + env(safe-area-inset-bottom)); gap:0.3rem; }
    .scroll-hint .label{ font-size:1rem; letter-spacing:0.3em; padding-left:0.3em; }
    .scroll-hint svg{ width:38px; height:auto; }
  }

  @media (orientation:portrait){
    .bg-half{ inset:auto; top:50%; left:0; width:100%; height:62.5vw; transform:translateY(-50%); object-fit:cover; }
    .shutter-line{ top:calc(50% - 31.25vw); bottom:auto; height:62.5vw; }
    body{ background:#ffffff; }
    .signature{ color:#0a0a0a; }
    .scroll-hint .label{ color:#0a0a0a; text-shadow:none; }
    .scroll-hint svg path{ stroke:#0a0a0a; }
    .scroll-hint svg{ filter:none; }
  }
</style>
</head>
<body>
<script>
if(/[?&]entree\b/.test(location.search)) document.write('<style>#entree{position:fixed;inset:0;z-index:10000;border:0;padding:0;margin:0;width:100%;height:100%;background:#fff url(images/entree_ia.jpg?v=2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}#entree span{font-family:Barlow,sans-serif;font-weight:400;font-size:1.05rem;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#fff;border:1.5px solid #fff;padding:1.05rem 3.4rem;text-shadow:0 0 12px rgba(0,0,0,.25);box-shadow:0 0 14px rgba(0,0,0,.12),inset 0 0 14px rgba(0,0,0,.08);transition:background .3s}#entree:hover span{background:rgba(255,255,255,.12)}@media (max-width:768px){#entree{background-size:100% auto}#entree span{font-size:.9rem;padding:.9rem 2.6rem}}</style><button id="entree" type="button" aria-label="Enter"><span>Enter</span></button>');
</script>

  <div id="scenes">
    <!-- Accueil actuel : une seule image plein écran -->
    <section class="scene still plein">
      <img class="bg-half" src="accueil-colonne.jpg" alt="">
      <div class="signature">Laurent Bourdoiseau</div>
    </section>

    <!-- Série split screen mise de côté (non affichée, non chargée) : pour la remettre, retirer les balises <template> -->
    <template id="splitscreen-scenes">
    <section class="scene" data-scene="1">
      <img class="bg-half bg-l" src="scene4-left.jpg" alt="">
      <img class="bg-half bg-r" src="scene4-right.jpg" alt="">

    <section class="scene" data-scene="2">

    </section>

    <section class="scene" data-scene="3">

      <img class="bg-half bg-r" src="scene5-right.jpg" alt="">

    </section>

    <section class="scene" data-scene="4">
      <img class="bg-half bg-l" src="scene10-left.jpg" alt="">

    </section>

    <section class="scene" data-scene="5">
      <img class="bg-half bg-l" src="scene11-left.jpg" alt="">
      <img class="bg-half bg-r" src="scene11-right.jpg" alt="">

    </section>

    <section class="scene" data-scene="6">
      <img class="bg-half bg-l" src="scene8-left.jpg" alt="">

    <section class="scene" data-scene="8">
      <img class="bg-half bg-l" src="scene12-left.jpg" alt="">

      <div class="shutter-line"></div>

    </template>
  </div>

  <div class="scroll-hint" aria-hidden="true">
    <span class="label">Scroll</span>
    <svg width="56" height="72" viewBox="0 0 56 72" fill="none">
      <path d="M8 20L28 36L48 20" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 40L28 56L48 40" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <nav class="choice">
    <a class="photo" href="photos/">Photo</a>
    <a class="ia" href="ia/">IA</a>
    <a class="macro" href="macro/">Macro IA</a>
    <a class="portfolio" href="portfolio/">Portfolio</a>
  </nav>

  <script>
    (function(){
      var scenesEl = document.getElementById('scenes');
      var scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));

      scenes.forEach(function(scene){
        if (scene.classList.contains('still')) return;
        if (scene.classList.contains('scrub')){
          var imgs = Array.prototype.slice.call(scene.querySelectorAll('.scrub-img'));
          var current = 0;

          var scrubLine = scene.querySelector('.scrub-line');

          function placeLine(pct){ scrubLine.style.left = pct + '%'; }
          function centerOf(i){ return (i + 0.5) / imgs.length * 100; }

          function showImg(i, keepLine){
            i = Math.max(0, Math.min(imgs.length - 1, i));
            if (!keepLine) placeLine(centerOf(i));
            if (i === current) return;
            imgs[current].classList.remove('on');
            imgs[i].classList.add('on');
            current = i;
          }

          function followPointer(clientX){
            var rect = scene.getBoundingClientRect();
            var pct = Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
            placeLine(pct);
            showImg(Math.floor(pct / 100 * imgs.length), true);
          }

          scene.addEventListener('mousemove', function(e){ followPointer(e.clientX); });
          scene.addEventListener('mouseleave', function(){ showImg(0); });
          scene.addEventListener('touchmove', function(e){
            if (e.touches[0]) followPointer(e.touches[0].clientX);
          }, { passive:true });
          scene.addEventListener('touchend', function(){ showImg(0); });

          return;
        }

        var l = scene.querySelector('.bg-l');
        var r = scene.querySelector('.bg-r');
        var line = scene.querySelector('.shutter-line');
        var demoed = false;

        function setSplit(pct){
          pct = Math.max(0, Math.min(100, pct));
          l.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
          r.style.clipPath = 'inset(0 0 0 ' + pct + '%)';
          line.style.left = pct + '%';
        }

        function snapToCenter(){
          scene.classList.add('snap-back');
          setSplit(50);
        }

        function pctFromClientX(clientX){
          var rect = scene.getBoundingClientRect();
          return ((clientX - rect.left) / rect.width) * 100;
        }

        scene.addEventListener('mousemove', function(e){
          scene.classList.remove('snap-back');
          setSplit(pctFromClientX(e.clientX));
        });
        scene.addEventListener('mouseleave', snapToCenter);

        scene.addEventListener('touchmove', function(e){
          if (e.touches[0]){
            scene.classList.remove('snap-back');
            setSplit(pctFromClientX(e.touches[0].clientX));
          }
        }, { passive:true });
        scene.addEventListener('touchend', snapToCenter);

        function runDemo(){
          if (demoed) return;
          demoed = true;
          var t0 = performance.now();
          function step(t){
            var e = (t - t0) / 900;
            if (e > 1){ setSplit(50); return; }
            setSplit(50 - Math.sin(e * Math.PI) * 16);
            requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

        new IntersectionObserver(function(entries){
          entries.forEach(function(en){ if (en.isIntersecting) runDemo(); });
        }, { root:scenesEl, threshold:0.6 }).observe(scene);
      });

      // Indice de scroll : visible sur chaque scène (sauf la dernière),
      // s'efface pendant le scroll, revient 3s après l'arrêt si on est
      // toujours sur une scène qui a une suite. Réapparaît aussi en
      // remontant vers une scène précédente.
      var hint = document.querySelector('.scroll-hint');
      var activeIndex = 0;
      var reappearTimer = null;

      function hasNext(i){ return i < scenes.length - 1; }

      function applyHintVisibility(){
        hint.style.opacity = hasNext(activeIndex) ? '1' : '0';
      }

      scenes.forEach(function(scene, i){
        new IntersectionObserver(function(entries){
          entries.forEach(function(en){
            if (en.isIntersecting && en.intersectionRatio > 0.6){
              activeIndex = i;
              if (reappearTimer) clearTimeout(reappearTimer);
              applyHintVisibility();
            }
          });
        }, { root:scenesEl, threshold:[0, 0.6] }).observe(scene);
      });

      var supportsScrollEnd = 'onscrollend' in window;

      scenesEl.addEventListener('scroll', function(){
        hint.style.opacity = '0';
        if (reappearTimer) clearTimeout(reappearTimer);
        if (!supportsScrollEnd){
          reappearTimer = setTimeout(applyHintVisibility, 350);
        }
      });

      if (supportsScrollEnd){
        scenesEl.addEventListener('scrollend', applyHintVisibility);
      }
    })();
  </script>

  <script>
    // La page IA est chargée en arrière-plan, puis affichée par-dessus au clic sur « IA », sans changer de page :
    // le teaser peut ainsi démarrer avec le son dans ce même clic (Safari l'interdit après un changement de page).
    (function(){
      var lien=document.querySelector('nav.choice a.ia'); if(!lien) return;
      var cadre=null, pret=false, ouvert=false, titreAccueil=document.title;
      var attente=false, entree=document.getElementById('entree');
      function preparer(){
        cadre=document.createElement('iframe');
        cadre.src='ia/';
        cadre.setAttribute('allow','autoplay; fullscreen; picture-in-picture');
        cadre.setAttribute('allowfullscreen','');
        cadre.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#fff;display:none;';
        // prête dès que son script est chargé, sans attendre toutes ses vidéos (sinon un clic rapide sur « IA » passait à côté)
        var guet=setInterval(function(){ try{ if(typeof cadre.contentWindow.entrerAvecSon==='function' && cadre.contentDocument.querySelector('.cell-top video')){ pret=true; clearInterval(guet); if(attente){ attente=false; lien.click(); } } }catch(e){} },150);
        document.body.appendChild(cadre);
      }
      function fermer(){
        if(!ouvert) return; ouvert=false;
        try{ cadre.contentWindow.sortirEnSilence(); }catch(e){}
        cadre.style.display='none'; document.title=titreAccueil;
      }
      lien.addEventListener('click',function(e){
        if(!pret || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;      // sinon : navigation normale
        e.preventDefault();
        cadre.style.display='block'; ouvert=true;
        void cadre.getBoundingClientRect().width;      // la page IA doit connaître sa vraie taille avant de se placer sur la vidéo
        try{ cadre.contentWindow.entrerAvecSon(); document.title=cadre.contentDocument.title||titreAccueil; }catch(err){}
        history.pushState({ia:true},'','ia/');
        try{ cadre.contentWindow.focus(); }catch(err){}
      });
      // écran ENTER (lien direct vers la page IA) : tout l'écran réagit, dès son affichage ; un doigt qui bouge un peu compte
      if(entree){
        var x0=0, y0=0, fait=false;
        var entrer=function(){ if(fait) return; fait=true; entree.parentNode.removeChild(entree); if(pret) lien.click(); else attente=true; };
        entree.addEventListener('touchstart',function(ev){ x0=ev.touches[0].clientX; y0=ev.touches[0].clientY; },{passive:true});
        entree.addEventListener('touchmove',function(ev){ ev.preventDefault(); },{passive:false});
        entree.addEventListener('touchend',function(ev){ var p=ev.changedTouches[0]; if(Math.abs(p.clientX-x0)>40 || Math.abs(p.clientY-y0)>40) return; if(ev.cancelable) ev.preventDefault(); entrer(); });
        entree.addEventListener('click',function(ev){ ev.stopPropagation(); entrer(); });
      }
      // un clic sur la photo mène aussi à la page IA (par le même chemin, donc avec le son)
      var photo=document.querySelector('.scene.still');
      if(photo){ photo.style.cursor='pointer'; photo.addEventListener('click',function(e){ if(e.target.closest('a')) return; lien.click(); }); }
      window.addEventListener('popstate',function(){
        if(ouvert){ fermer(); return; }
        if(/\/ia\/?$/.test(location.pathname)) location.reload();                 // « suivant » après un retour : on charge la vraie page
      });
      if(document.readyState==='complete') setTimeout(preparer,300); else window.addEventListener('load',function(){ setTimeout(preparer,300); });
    })();
  </script>
  <script src="/image-protection.js"></script>
