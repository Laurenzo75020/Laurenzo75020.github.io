<style>
  :root{ --ink:#0a0a0a; --bg:#ffffff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Barlow', sans-serif;
    overflow:hidden;
    cursor:pointer;
  }
  .top-menu a{ cursor:pointer; }

  .top-menu{
    position:fixed;
    top:1.4rem;
    right:2rem;
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:0.5rem;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    pointer-events:none;
  }
  .top-menu a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.85;
    transition:opacity 0.2s;
    pointer-events:auto;
  }
  .top-menu a:hover{ opacity:1; }

  .counter{
    position:fixed;
    top:1.4rem;
    left:50%;
    transform:translateX(-50%);
    z-index:200;
    font-size:0.75rem;
    letter-spacing:0.1em;
    color:#999;
    pointer-events:none;
  }

  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:5vh 4vw;
  }
  .stage img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    opacity:0;
    transition:opacity 0.35s ease;
    -webkit-user-drag:none;
    -webkit-user-select:none;
    user-select:none;
    pointer-events:none;
  }
  .stage img.show{ opacity:1; }

  .arrow{
    position:fixed;
    top:0;
    bottom:0;
    width:12%;
    min-width:56px;
    display:flex;
    align-items:center;
    z-index:150;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--ink);
    opacity:0;
    transition:opacity 0.2s;
  }
  .stage:hover ~ .arrow,
  .arrow:hover{ opacity:0.55; }
  .arrow.prev{ left:0; justify-content:flex-start; padding-left:1.2rem; }
  .arrow.next{ right:0; justify-content:flex-end; padding-right:1.2rem; }
  .arrow svg{ width:28px; height:28px; }
  .arrow[disabled]{ visibility:hidden; }

  .loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.75rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#999;
  }

  .dot-arrow{
    position:fixed;
    top:50%;
    right:2vw;
    transform:translateY(-50%);
    width:min(24vw, 360px);
    color:var(--ink);
    opacity:0;
    pointer-events:none;
    z-index:100;
    transition:opacity 0.6s ease;
  }
  .dot-arrow.show{ opacity:0.32; }
  .dot-arrow svg{ width:100%; height:auto; display:block; }

  @media (max-width:768px){
    .dot-arrow{ width:min(38vw, 220px); right:1vw; }
  }

  @media (max-width:560px){
    .top-menu{ top:1rem; right:1.25rem; font-size:0.7rem; gap:0.4rem; }
    .counter{ top:1rem; font-size:0.65rem; }
    .arrow{ width:18%; }
    .stage{ padding:2vh 1vw; }
  }

  @media (max-width:560px) and (orientation:portrait){
    .stage{ padding:1vh 0.5vw; }
  }
</style>

  <script>
    // Dossier contenant les pages du book (une image par page, mise en page déjà intégrée à l'image)
    const REPO_API = "https://api.github.com/repos/Laurenzo75020/Laurenzo75020.github.io/contents/photo/book";
    const IMG_EXT = /\.(jpe?g|png|webp)$/i;
    const IMG_BASE = 'photo/book/';

    let pages = [];
    let current = 0;

    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    async function loadPages(){
      try{
        const res = await fetch(REPO_API + '?t=' + Date.now(), { cache:"no-store" });
        if(!res.ok) throw new Error("API error " + res.status);
        const files = await res.json();

        pages = files
          .filter(f => f.type === "file" && IMG_EXT.test(f.name))
          .filter(f => !/^page_0(\D|$)/i.test(f.name))
          .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:"base" }));

        if(pages.length === 0){
          stage.innerHTML = '<div class="loading">Aucune page trouvée.</div>';
          return;
        }

        stage.innerHTML = '<img id="pageImg" src="" alt="">';
        showPage(0);
      }catch(err){
        stage.innerHTML = '<div class="loading">Erreur de chargement.</div>';
        console.error(err);
      }
    }

    function showPage(i){
      current = Math.max(0, Math.min(i, pages.length - 1));
      const img = document.getElementById('pageImg');
      const file = pages[current];
      const src = IMG_BASE + encodeURIComponent(file.name) + '?v=' + file.sha.slice(0,8);

      img.classList.remove('show');
      const swap = () => {
        img.src = src;
        img.onload = () => img.classList.add('show');
      };
      setTimeout(swap, 150);

      counter.textContent = (current + 1) + ' / ' + pages.length;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === pages.length - 1;
      document.getElementById('dotArrow').classList.toggle('show', current === 0);

      // preload voisins
      [current - 1, current + 1].forEach(idx => {
        if(idx >= 0 && idx < pages.length){
          const pre = new Image();
          pre.src = IMG_BASE + encodeURIComponent(pages[idx].name) + '?v=' + pages[idx].sha.slice(0,8);
        }
      });
    }

    prevBtn.addEventListener('click', () => showPage(current - 1));
    nextBtn.addEventListener('click', () => showPage(current + 1));

    // Clic sur la moitié gauche/droite de la fenêtre pour naviguer
    document.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('.arrow')) return;
      const isLeft = e.clientX < window.innerWidth / 2;
      isLeft ? showPage(current - 1) : showPage(current + 1);
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowLeft') showPage(current - 1);
      if(e.key === 'ArrowRight') showPage(current + 1);
    });

    // swipe mobile
    let touchStartX = null;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', e => {
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(dx) > 50) dx > 0 ? showPage(current - 1) : showPage(current + 1);
      touchStartX = null;
    }, {passive:true});

    loadPages();

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
  </script>
