<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurent Bourdoiseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Barlow+Condensed:wght@300;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#f5f3ee; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
    -webkit-overflow-scrolling:auto;
  }
  body{
    width:100%;
    background:#0a0a0a;
    color:var(--ink);
    font-family:'Fraunces', serif;
    cursor:pointer;
  }

  .bg-half{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 38%;
    transition:filter 0.5s ease;
  }

  .bg-left{ clip-path:inset(0 50% 0 0); filter:brightness(1); }
  .bg-right{ clip-path:inset(0 0 0 50%); filter:brightness(0.65); }

  body.hover-left .bg-left{ filter:brightness(1.15) saturate(1.05); }
  body.hover-left .bg-right{ filter:brightness(0.55); }

  body.hover-right .bg-right{ filter:brightness(1.15) saturate(1.05); }
  body.hover-right .bg-left{ filter:brightness(0.55); }

  @media (min-width:900px) and (min-aspect-ratio:1/1){
    .bg-half{ object-position:center center; }
  }

  .veil{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.55) 100%);
    z-index:1;
    pointer-events:none;
  }

  .signature{
    position:fixed;
    top:5vh;
    left:2.2rem;
    z-index:2;
    text-align:left;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:900;
    font-size:clamp(2.6rem, 5.85vw, 6.5rem);
    line-height:0.88;
    letter-spacing:-0.02em;
    text-transform:uppercase;
    opacity:0.95;
    pointer-events:none;
  }

  nav.choice{
    position:fixed;
    top:calc(3.4rem + env(safe-area-inset-top));
    right:calc(2rem + env(safe-area-inset-right));
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1rem;
  }

  nav.choice a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.9;
    transition:opacity 0.2s ease;
    white-space:nowrap;
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:rgba(255,255,255,0.95);
    color:#0a0a0a;
    padding:0.5rem 1rem;
    box-shadow:0 1px 4px rgba(0,0,0,0.12);
  }

  nav.choice a:hover{
    opacity:1;
  }

  @media (max-width:899px){
    .veil{
      background:linear-gradient(to bottom, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.12) 30%, rgba(0,0,0,0.55) 100%);
    }
  }

  @media (max-width:560px){
    .signature{ top:calc(4vh + env(safe-area-inset-top)); left:1.4rem; font-size:clamp(1.8rem, 8vw, 3rem); }
    nav.choice{
      top:auto;
      bottom:calc(1.4rem + env(safe-area-inset-bottom));
      gap:0.6rem;
    }
    nav.choice a{
      font-size:0.85rem;
      padding:0.35rem 0.7rem;
    }
  }
</style>
</head>
<body>

  <picture>
    <source media="(min-width:900px) and (min-aspect-ratio:1/1)" srcset="accueil_desktop.jpg">
    <img class="bg-half bg-left" src="accueil.jpg" alt="">
  </picture>
  <picture>
    <source media="(min-width:900px) and (min-aspect-ratio:1/1)" srcset="accueil_desktop.jpg">
    <img class="bg-half bg-right" src="accueil.jpg" alt="">
  </picture>
  <div class="veil"></div>

  <div class="signature">Laurent Bourdoiseau</div>

  <nav class="choice">
    <a class="photo" href="photos/">Photo</a>
    <a class="ia" href="ia/">IA</a>
    <a class="portfolio" href="portfolio/">Portfolio</a>
  </nav>

  <script>
    (function(){
      var body = document.body;

      function setSide(clientX){
        var isLeft = clientX < window.innerWidth / 2;
        body.classList.toggle('hover-left', isLeft);
        body.classList.toggle('hover-right', !isLeft);
      }

      function clearSide(){
        body.classList.remove('hover-left', 'hover-right');
      }

      // Souris (desktop)
      window.addEventListener('mousemove', function(e){ setSide(e.clientX); });
      window.addEventListener('mouseleave', clearSide);

      // Tactile (mobile)
      window.addEventListener('touchstart', function(e){
        if (e.touches[0]) setSide(e.touches[0].clientX);
      }, { passive:true });
      window.addEventListener('touchmove', function(e){
        if (e.touches[0]) setSide(e.touches[0].clientX);
      }, { passive:true });
      window.addEventListener('touchend', clearSide);

      document.addEventListener('click', function(e){
        if (e.target.closest('a')) return; // liens du menu gèrent déjà leur propre clic
        var isLeft = e.clientX < window.innerWidth / 2;
        window.location.href = isLeft ? 'photo/' : 'ia/';
      });
    })();
  </script>

  <script src="/image-protection.js"></script>
</body>
</html>
