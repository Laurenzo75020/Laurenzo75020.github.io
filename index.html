<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurent Bourdoiseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0a0a0a; --bg:#ffffff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Barlow', sans-serif;
    overflow:hidden;
    cursor:pointer;
  }
  .top-menu a{ cursor:pointer; }

  .top-menu{
    position:fixed;
    top:1.4rem;
    right:2rem;
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:0.5rem;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    pointer-events:none;
  }
  .top-menu a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.85;
    transition:opacity 0.2s;
    pointer-events:auto;
  }
  .top-menu a:hover{ opacity:1; }

  .counter{
    position:fixed;
    top:1.4rem;
    left:50%;
    transform:translateX(-50%);
    z-index:200;
    font-size:0.75rem;
    letter-spacing:0.1em;
    color:#999;
    cursor:pointer;
    pointer-events:auto;
  }

  .scrubber{
    position:fixed;
    top:2.6rem;
    left:50%;
    transform:translateX(-50%);
    z-index:210;
    display:none;
    max-width:min(80vw, 520px);
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    background:rgba(255,255,255,0.94);
    padding:0.5rem 1rem;
    scrollbar-width:none;
  }
  .scrubber::-webkit-scrollbar{ display:none; }
  .scrubber.open{ display:block; }
  .scrubber .pad{ display:inline-block; width:40vw; }
  .scrubber .num{
    display:inline-block;
    width:26px;
    text-align:center;
    font-size:0.7rem;
    letter-spacing:0.02em;
    color:#bbb;
    scroll-snap-align:center;
    cursor:pointer;
    transition:color 0.15s;
  }
  .scrubber .num.active{ color:var(--ink); font-weight:600; }

  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5vh 1vw;
  }
  .stage img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    opacity:0;
    transition:opacity 0.35s ease;
    -webkit-user-drag:none;
    -webkit-user-select:none;
    user-select:none;
    pointer-events:none;
  }
  .stage img.show{ opacity:1; }

  .arrow{
    position:fixed;
    top:0;
    bottom:0;
    width:12%;
    min-width:56px;
    display:flex;
    align-items:center;
    z-index:150;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--ink);
    opacity:0;
    transition:opacity 0.2s;
  }
  .stage:hover ~ .arrow,
  .arrow:hover{ opacity:0.55; }

  @media (hover:none) and (pointer:coarse){
    .arrow{ opacity:0.4; }
  }
  .arrow.prev{ left:0; justify-content:flex-start; padding-left:1.2rem; }
  .arrow.next{ right:0; justify-content:flex-end; padding-right:1.2rem; }
  .arrow.next.centered{
    left:75%;
    right:auto;
    width:auto;
    min-width:0;
    justify-content:center;
    padding:0;
    transform:translateX(-50%);
    opacity:0.55;
  }
  .arrow svg{ width:28px; height:28px; }
  .arrow[disabled]{ visibility:hidden; }

  .loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.75rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#999;
  }

  @media (max-width:560px){
    .top-menu{ top:1rem; right:1.25rem; font-size:0.7rem; gap:0.4rem; }
    .counter{ top:1rem; font-size:0.65rem; }
    .arrow{ width:18%; }
    .stage{ padding:0.6vh 0.4vw; }
  }

  @media (max-width:560px) and (orientation:portrait){
    .stage{ padding:0.3vh 0.2vw; }
  }
</style>
</head>
<body>

  <div class="top-menu">
    <a href="accueil.html" id="homeLink">← Accueil</a>
    <a href="photo/mosaique.html">Mosaïque</a>
    <a href="ia/">IA</a>
  </div>
  <div class="counter" id="counter"></div>
  <div class="scrubber" id="scrubber"><span class="pad"></span><span class="pad"></span></div>

  <div class="stage" id="stage">
    <div class="loading" id="loading">Chargement…</div>
  </div>

  <button class="arrow prev" id="prevBtn" aria-label="Page précédente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="arrow next" id="nextBtn" aria-label="Page suivante">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <script>
    // Dossier contenant les pages du book (une image par page, mise en page déjà intégrée à l'image)
    const REPO_API = "https://api.github.com/repos/Laurenzo75020/Laurenzo75020.github.io/contents/photo/book";
    const IMG_EXT = /\.(jpe?g|png|webp)$/i;
    const IMG_BASE = 'photo/book/';

    let pages = [];
    let current = 0;

    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    async function loadPages(){
      try{
        const res = await fetch(REPO_API + '?t=' + Date.now(), { cache:"no-store" });
        if(!res.ok) throw new Error("API error " + res.status);
        const files = await res.json();

        pages = files
          .filter(f => f.type === "file" && IMG_EXT.test(f.name))
          .filter(f => !/^page_0(\D|$)/i.test(f.name))
          .sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:"base" }));

        if(pages.length === 0){
          stage.innerHTML = '<div class="loading">Aucune page trouvée.</div>';
          return;
        }

        stage.innerHTML = '<img id="pageImg" src="" alt="">';
        buildScrubber();
        showPage(0);
      }catch(err){
        stage.innerHTML = '<div class="loading">Erreur de chargement.</div>';
        console.error(err);
      }
    }

    function showPage(i){
      current = Math.max(0, Math.min(i, pages.length - 1));
      const img = document.getElementById('pageImg');
      const file = pages[current];
      const src = IMG_BASE + encodeURIComponent(file.name) + '?v=' + file.sha.slice(0,8);

      img.classList.remove('show');
      const swap = () => {
        img.src = src;
        img.onload = () => img.classList.add('show');
      };
      setTimeout(swap, 150);

      counter.textContent = (current + 1) + ' / ' + pages.length;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === pages.length - 1;
      nextBtn.classList.toggle('centered', current === 0);
      updateScrubberActive();

      // preload voisins
      [current - 1, current + 1].forEach(idx => {
        if(idx >= 0 && idx < pages.length){
          const pre = new Image();
          pre.src = IMG_BASE + encodeURIComponent(pages[idx].name) + '?v=' + pages[idx].sha.slice(0,8);
        }
      });
    }

    prevBtn.addEventListener('click', () => showPage(current - 1));
    nextBtn.addEventListener('click', () => showPage(current + 1));

    // Clic sur la moitié gauche/droite de la fenêtre pour naviguer
    document.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('.arrow') || e.target.closest('.counter') || e.target.closest('.scrubber')) return;
      if (scrubber.classList.contains('open')) { scrubber.classList.remove('open'); return; }
      const isLeft = e.clientX < window.innerWidth / 2;
      isLeft ? showPage(current - 1) : showPage(current + 1);
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowLeft') showPage(current - 1);
      if(e.key === 'ArrowRight') showPage(current + 1);
    });

    // swipe mobile
    let touchStartX = null;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', e => {
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(dx) > 50) dx > 0 ? showPage(current - 1) : showPage(current + 1);
      touchStartX = null;
    }, {passive:true});

    loadPages();

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());

    // Bande de navigation "tuner FM"
    const scrubber = document.getElementById('scrubber');
    let scrubTimeout = null;
    let scrubbing = false;

    function buildScrubber(){
      const frag = document.createDocumentFragment();
      const padStart = document.createElement('span');
      padStart.className = 'pad';
      frag.appendChild(padStart);
      pages.forEach((p, idx) => {
        const el = document.createElement('span');
        el.className = 'num';
        el.textContent = idx + 1;
        el.dataset.idx = idx;
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          showPage(idx);
          scrollActiveIntoView(true);
        });
        frag.appendChild(el);
      });
      const padEnd = document.createElement('span');
      padEnd.className = 'pad';
      frag.appendChild(padEnd);
      scrubber.innerHTML = '';
      scrubber.appendChild(frag);
    }

    function updateScrubberActive(){
      scrubber.querySelectorAll('.num').forEach(el => {
        el.classList.toggle('active', Number(el.dataset.idx) === current);
      });
      if(scrubber.classList.contains('open') && !scrubbing) scrollActiveIntoView(false);
    }

    function scrollActiveIntoView(smooth){
      const active = scrubber.querySelector('.num.active');
      if(active) active.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', inline: 'center', block: 'nearest' });
    }

    counter.addEventListener('click', (e) => {
      e.stopPropagation();
      const opening = !scrubber.classList.contains('open');
      scrubber.classList.toggle('open', opening);
      if(opening) scrollActiveIntoView(false);
    });

    scrubber.addEventListener('click', (e) => e.stopPropagation());

    scrubber.addEventListener('scroll', () => {
      scrubbing = true;
      clearTimeout(scrubTimeout);
      scrubTimeout = setTimeout(() => {
        scrubbing = false;
        const rect = scrubber.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        let closest = null, closestDist = Infinity;
        scrubber.querySelectorAll('.num').forEach(el => {
          const r = el.getBoundingClientRect();
          const dist = Math.abs((r.left + r.width/2) - centerX);
          if(dist < closestDist){ closestDist = dist; closest = el; }
        });
        if(closest){
          const idx = Number(closest.dataset.idx);
          if(idx !== current) showPage(idx);
        }
      }, 120);
    }, { passive:true });
  </script>

</body>
</html>
