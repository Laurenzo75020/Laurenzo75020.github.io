<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurent Bourdoiseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600&family=Barlow+Condensed:wght@300;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#ffffff; --split:50%; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
    -webkit-overflow-scrolling:auto;
  }
  body{
    width:100%;
    background:#0a0a0a;
    color:var(--ink);
    font-family:'Fraunces', serif;
    cursor:default;
  }

  .bg-half{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  .bg-left{ clip-path:inset(0 calc(100% - var(--split)) 0 0); }
  .bg-right{ clip-path:inset(0 0 0 var(--split)); }

  body.snap-back .bg-left,
  body.snap-back .bg-right{ transition:clip-path 0.6s ease; }

  .shutter-line{
    position:fixed;
    top:0;
    bottom:0;
    left:var(--split);
    width:2px;
    margin-left:-1px;
    background:rgba(255,255,255,0.85);
    box-shadow:0 0 12px rgba(0,0,0,0.35);
    z-index:1;
    pointer-events:none;
  }

  body.snap-back .shutter-line{ transition:left 0.6s ease; }

  .veil{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.35) 100%);
    z-index:1;
    pointer-events:none;
  }

  .signature{
    position:fixed;
    top:5vh;
    left:2.2rem;
    z-index:2;
    text-align:left;
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(2.6rem, 5.85vw, 6.5rem);
    line-height:0.88;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    text-shadow:0 2px 14px rgba(0,0,0,0.5);
    opacity:1;
    pointer-events:none;
  }

  nav.choice{
    position:fixed;
    top:calc(3.4rem + env(safe-area-inset-top));
    right:calc(2rem + env(safe-area-inset-right));
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1rem;
  }

  nav.choice a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.9;
    transition:opacity 0.2s ease;
    white-space:nowrap;
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:rgba(255,255,255,0.95);
    color:#0a0a0a;
    padding:0.5rem 1rem;
    box-shadow:0 1px 4px rgba(0,0,0,0.12);
  }

  nav.choice a:hover{
    opacity:1;
  }

  @media (max-width:899px){
    .veil{
      background:linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.08) 30%, rgba(0,0,0,0.38) 100%);
    }
  }

  @media (max-width:560px){
    .signature{ top:calc(4vh + env(safe-area-inset-top)); left:1.4rem; font-size:clamp(1.8rem, 8vw, 3rem); }
    nav.choice{
      top:auto;
      bottom:calc(1.4rem + env(safe-area-inset-bottom));
      gap:0.6rem;
    }
    nav.choice a{
      font-size:0.85rem;
      padding:0.35rem 0.7rem;
    }
  }
</style>
</head>
<body>

  <img class="bg-half bg-left" src="hero-right.jpg" alt="">
  <img class="bg-half bg-right" src="hero-left.jpg" alt="">
  <div class="shutter-line"></div>
  <div class="veil"></div>

  <div class="signature">Laurent Bourdoiseau</div>

  <nav class="choice">
    <a class="photo" href="photos/">Photo</a>
    <a class="ia" href="ia/">IA</a>
    <a class="portfolio" href="portfolio/">Portfolio</a>
  </nav>

  <script>
    (function(){
      var root = document.documentElement;
      var body = document.body;

      function setSplit(clientX){
        var pct = Math.max(0, Math.min(100, (clientX / window.innerWidth) * 100));
        root.style.setProperty('--split', pct + '%');
      }

      function snapToCenter(){
        body.classList.add('snap-back');
        root.style.setProperty('--split', '50%');
      }

      // Souris (desktop) : le volet suit le curseur en continu
      window.addEventListener('mousemove', function(e){
        body.classList.remove('snap-back');
        setSplit(e.clientX);
      });
      window.addEventListener('mouseleave', snapToCenter);

      // Tactile (mobile) : le volet suit le doigt
      window.addEventListener('touchmove', function(e){
        if (e.touches[0]){
          body.classList.remove('snap-back');
          setSplit(e.touches[0].clientX);
        }
      }, { passive:true });
      window.addEventListener('touchend', snapToCenter);
    })();
  </script>

  <script src="/image-protection.js"></script>
</body>
</html>
