<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurent Bourdoiseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Barlow+Condensed:wght@300;800;900&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#ffffff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  body{
    width:100%;
    background:#0a0a0a;
    color:var(--ink);
    font-family:'Fraunces', serif;
    cursor:default;
  }

  #scenes{
    position:fixed;
    inset:0;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
  }

  .scene{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    scroll-snap-align:start;
    scroll-snap-stop:always;
  }

  .bg-half{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  .bg-l{ clip-path:inset(0 50% 0 0); }
  .bg-r{ clip-path:inset(0 0 0 50%); }

  .scene.snap-back .bg-l,
  .scene.snap-back .bg-r{ transition:clip-path 0.6s ease; }

  .shutter-line{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:2px;
    margin-left:-1px;
    background:rgba(255,255,255,0.85);
    box-shadow:0 0 12px rgba(0,0,0,0.35);
    z-index:1;
    pointer-events:none;
  }

  .scene.snap-back .shutter-line{ transition:left 0.6s ease; }

  .scroll-hint{
    position:fixed;
    left:75%;
    bottom:calc(4.6rem + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:2;
    opacity:1;
    transition:opacity 0.5s ease;
    pointer-events:none;
  }

  .scroll-hint svg{
    display:block;
    animation:hint-bounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.45));
  }

  @keyframes hint-bounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(8px); }
  }

  .signature{
    position:absolute;
    top:calc(3.4rem + env(safe-area-inset-top));
    left:2.2rem;
    right:2.2rem;
    min-height:2.2rem;
    z-index:2;
    display:flex;
    align-items:center;
    text-align:left;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:900;
    font-size:clamp(2.6rem, 5.85vw, 6.5rem);
    line-height:0.88;
    letter-spacing:0.04em;
    text-transform:uppercase;
    opacity:1;
    pointer-events:none;
  }

  nav.choice{
    position:fixed;
    top:calc(3.4rem + env(safe-area-inset-top));
    right:calc(2rem + env(safe-area-inset-right));
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1rem;
  }

  nav.choice a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.9;
    transition:opacity 0.2s ease;
    white-space:nowrap;
    font-family:'Barlow', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:rgba(255,255,255,0.95);
    color:#0a0a0a;
    padding:0.5rem 1rem;
    box-shadow:0 1px 4px rgba(0,0,0,0.12);
  }

  nav.choice a:hover{
    opacity:1;
  }

  @media (max-width:560px){
    .signature{ top:calc(4vh + env(safe-area-inset-top)); left:1.4rem; right:1.4rem; font-size:clamp(1.8rem, 8vw, 3rem); }
    nav.choice{
      top:auto;
      bottom:calc(1.4rem + env(safe-area-inset-bottom));
      gap:0.6rem;
    }
    nav.choice a{
      font-size:0.85rem;
      padding:0.35rem 0.7rem;
    }
    .scroll-hint{ left:1.4rem; transform:none; bottom:calc(5.6rem + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

  <div id="scenes">
    <section class="scene" data-scene="1">
      <img class="bg-half bg-l" src="scene5-left.jpg" alt="">
      <img class="bg-half bg-r" src="scene5-right.jpg" alt="">
      <div class="shutter-line"></div>
      <div class="signature">Laurent Bourdoiseau</div>
    </section>

    <section class="scene" data-scene="2">
      <img class="bg-half bg-l" src="scene4-left.jpg" alt="">
      <img class="bg-half bg-r" src="scene4-right.jpg" alt="">
      <div class="shutter-line"></div>
    </section>

    <section class="scene" data-scene="3">
      <img class="bg-half bg-l" src="hero-right.jpg" alt="">
      <img class="bg-half bg-r" src="hero-left.jpg" alt="">
      <div class="shutter-line"></div>
    </section>

    <section class="scene" data-scene="4">
      <img class="bg-half bg-l" src="scene2-left.jpg" alt="">
      <img class="bg-half bg-r" src="scene2-right.jpg" alt="">
      <div class="shutter-line"></div>
    </section>

    <section class="scene" data-scene="5">
      <img class="bg-half bg-l" src="scene3-left.jpg" alt="">
      <img class="bg-half bg-r" src="scene3-right.jpg" alt="">
      <div class="shutter-line"></div>
    </section>
  </div>

  <div class="scroll-hint" aria-hidden="true">
    <svg width="56" height="72" viewBox="0 0 56 72" fill="none">
      <path d="M8 20L28 36L48 20" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 40L28 56L48 40" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <nav class="choice">
    <a class="photo" href="photos/">Photo</a>
    <a class="ia" href="ia/">IA</a>
    <a class="portfolio" href="portfolio/">Portfolio</a>
  </nav>

  <script>
    (function(){
      var scenesEl = document.getElementById('scenes');
      var scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));

      scenes.forEach(function(scene){
        var l = scene.querySelector('.bg-l');
        var r = scene.querySelector('.bg-r');
        var line = scene.querySelector('.shutter-line');
        var demoed = false;

        function setSplit(pct){
          pct = Math.max(0, Math.min(100, pct));
          l.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
          r.style.clipPath = 'inset(0 0 0 ' + pct + '%)';
          line.style.left = pct + '%';
        }

        function snapToCenter(){
          scene.classList.add('snap-back');
          setSplit(50);
        }

        function pctFromClientX(clientX){
          var rect = scene.getBoundingClientRect();
          return ((clientX - rect.left) / rect.width) * 100;
        }

        scene.addEventListener('mousemove', function(e){
          scene.classList.remove('snap-back');
          setSplit(pctFromClientX(e.clientX));
        });
        scene.addEventListener('mouseleave', snapToCenter);

        scene.addEventListener('touchmove', function(e){
          if (e.touches[0]){
            scene.classList.remove('snap-back');
            setSplit(pctFromClientX(e.touches[0].clientX));
          }
        }, { passive:true });
        scene.addEventListener('touchend', snapToCenter);

        function runDemo(){
          if (demoed) return;
          demoed = true;
          var t0 = performance.now();
          function step(t){
            var e = (t - t0) / 900;
            if (e > 1){ setSplit(50); return; }
            setSplit(50 - Math.sin(e * Math.PI) * 16);
            requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

        new IntersectionObserver(function(entries){
          entries.forEach(function(en){ if (en.isIntersecting) runDemo(); });
        }, { root:scenesEl, threshold:0.6 }).observe(scene);
      });

      // Indice de scroll : visible sur la scène 1, s'efface au scroll,
      // revient 3s après si on est toujours sur la scène 1.
      var scene1 = scenes[0];
      var hint = document.querySelector('.scroll-hint');
      var onScene1 = true;
      var reappearTimer = null;

      new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          onScene1 = en.isIntersecting && en.intersectionRatio > 0.6;
          if (!onScene1){
            hint.style.opacity = '0';
            if (reappearTimer) clearTimeout(reappearTimer);
          }
        });
      }, { root:scenesEl, threshold:[0, 0.6] }).observe(scene1);

      scenesEl.addEventListener('scroll', function(){
        if (!onScene1) return;
        hint.style.opacity = '0';
        if (reappearTimer) clearTimeout(reappearTimer);
        reappearTimer = setTimeout(function(){
          if (onScene1) hint.style.opacity = '1';
        }, 3000);
      });
    })();
  </script>

  <script src="/image-protection.js"></script>
</body>
</html>
