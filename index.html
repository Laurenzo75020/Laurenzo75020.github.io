<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Bourdoiseau — Photographie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --ink:#1a1a1a; --paper:#f5f4f1; --gap:56px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; }

    header{
      padding:2.5rem 3rem 1.5rem;
      font-size:0.65rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
    }
    header a{ color:var(--ink); text-decoration:none; margin-right:1.5rem; opacity:0.75; }
    header a:hover{ opacity:1; }
    header span{ opacity:1; font-weight:500; }

    .gallery{
      column-count:3;
      column-gap:var(--gap);
      column-fill:auto;
      padding:1rem 3rem 5rem;
    }

    .cell{
      break-inside:avoid;
      margin-bottom:var(--gap);
      line-height:0;
    }

    .cell img{
      width:100%;
      height:auto;
      display:block;
    }

    @media (max-width:980px){
      .gallery{ column-count:2; column-gap:32px; padding:1rem 1.5rem 4rem; }
      .cell{ margin-bottom:32px; }
      header{ padding:1.75rem 1.5rem 1rem; }
    }

    @media (max-width:560px){
      .gallery{ column-count:2; column-gap:14px; padding:0.5rem 1rem 3rem; }
      .cell{ margin-bottom:14px; }
      header{ padding:1.25rem 1.25rem 0.75rem; font-size:0.6rem; }
    }

    .loading{
      padding:2rem 3rem;
      font-size:0.7rem;
      letter-spacing:0.1em;
      text-transform:uppercase;
      opacity:0.4;
    }
  </style>
</head>
<body>

  <header>
    <a href="../">Laurent Bourdoiseau</a>
    <span>Photographie</span>
  </header>

  <main class="gallery" id="gallery" aria-label="Galerie photographie">
    <p class="loading">Chargement…</p>
  </main>

  <script>
    const REPO_API = "https://api.github.com/repos/Laurenzo75020/BOOK/contents/photo/images";
    const IMG_EXT = /\.(jpe?g|png|webp)$/i;

    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      try {
        const res = await fetch(REPO_API, { cache: "no-store" });
        if (!res.ok) throw new Error("API error " + res.status);
        const files = await res.json();

        const images = files
          .filter(f => f.type === "file" && IMG_EXT.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

        gallery.innerHTML = "";

        if (images.length === 0) {
          gallery.innerHTML = '<p class="loading">Aucune image trouvée.</p>';
          return;
        }

        // Répartition en 3 colonnes (col1: 0,3,6... col2: 1,4,7... col3: 2,5,8...)
        const columns = [[], [], []];
        images.forEach((img, i) => columns[i % 3].push(img));

        columns.forEach(col => {
          col.forEach(img => {
            const fig = document.createElement('figure');
            fig.className = 'cell';
            const el = document.createElement('img');
            el.src = 'images/' + encodeURIComponent(img.name);
            el.alt = '';
            el.loading = 'lazy';
            fig.appendChild(el);
            gallery.appendChild(fig);
          });
        });
      } catch (err) {
        gallery.innerHTML = '<p class="loading">Erreur de chargement de la galerie.</p>';
        console.error(err);
      }
    }

    loadGallery();
  </script>

</body>
</html>
