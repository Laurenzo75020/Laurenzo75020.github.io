<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurent Bourdoiseau — Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0a0a0a; --bg:#ffffff; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Barlow', sans-serif;
    overflow:hidden;
    cursor:pointer;
  }
  .top-menu a{ cursor:pointer; }

  .top-menu{
    position:fixed;
    top:1.4rem;
    right:2rem;
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:0.5rem;
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    pointer-events:none;
  }
  .top-menu a{
    color:var(--ink);
    text-decoration:none;
    opacity:0.9;
    transition:opacity 0.2s;
    pointer-events:auto;
    text-shadow:0 0 6px rgba(255,255,255,0.85), 0 0 12px rgba(255,255,255,0.6), 0 1px 2px rgba(255,255,255,0.9);
  }
  .top-menu a:hover{ opacity:1; }

  .counter-wrap{
    position:fixed;
    top:1.4rem;
    left:50%;
    transform:translateX(-50%);
    z-index:200;
  }

  .counter{
    font-size:0.75rem;
    letter-spacing:0.1em;
    color:#555;
    cursor:pointer;
    transition:opacity 0.15s;
    text-shadow:0 0 6px rgba(255,255,255,0.85), 0 0 12px rgba(255,255,255,0.6), 0 1px 2px rgba(255,255,255,0.9);
  }
  .counter.hidden{ opacity:0; pointer-events:none; }

  .scrubber{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    display:none;
    max-width:min(80vw, 520px);
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    background:rgba(255,255,255,0.94);
    padding:0.5rem 1rem;
    margin-top:-0.5rem;
    scrollbar-width:none;
    cursor:grab;
    user-select:none;
  }
  .scrubber::-webkit-scrollbar{ display:none; }
  .scrubber.open{ display:block; }
  .scrubber.dragging{ cursor:grabbing; }
  .scrubber .pad{ display:inline-block; width:40vw; }
  .scrubber .num{
    display:inline-block;
    width:26px;
    text-align:center;
    font-size:0.7rem;
    letter-spacing:0.02em;
    color:#bbb;
    cursor:pointer;
    transition:color 0.15s;
  }
  .scrubber .num.active{ color:var(--ink); font-weight:600; }

  .stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4.4rem 1vw 1.5vh 1vw;
  }
  .stage img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    opacity:0;
    transition:opacity 0.35s ease;
    -webkit-user-drag:none;
    -webkit-user-select:none;
    user-select:none;
    pointer-events:none;
  }
  .stage img.show{ opacity:1; }

  .arrow{
    position:fixed;
    top:0;
    bottom:0;
    width:12%;
    min-width:56px;
    display:flex;
    align-items:center;
    z-index:150;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--ink);
    opacity:0;
    transition:opacity 0.2s;
  }
  .stage:hover ~ .arrow,
  .arrow:hover{ opacity:0.55; }

  @media (hover:none) and (pointer:coarse){
    .arrow{ display:none; }
  }
  .arrow.prev{ left:0; justify-content:flex-start; padding-left:1.2rem; }
  .arrow.next{ right:0; justify-content:flex-end; padding-right:1.2rem; }
  .arrow svg{ width:28px; height:28px; }
  .arrow[disabled]{ visibility:hidden; }

  .loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
  }

  @media (max-width:768px){
    .top-menu{ top:1rem; right:1rem; gap:0.4rem; font-size:0.7rem; }
    .stage{ padding:3.2rem 1vw 1rem; }
    .stage img.portrait-contain{ max-height:85vh; }
  }
</style>
</head>
<body>

<nav class="top-menu">
  <a href="../">← Accueil</a>
</nav>

<div id="counterWrap" class="counter-wrap">
  <div class="counter" id="counter"></div>
  <div class="scrubber" id="scrubber"></div>
</div>

<div class="stage" id="stage"></div>

<button class="arrow prev" id="prevBtn" aria-label="Image précédente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
</button>
<button class="arrow next" id="nextBtn" aria-label="Image suivante">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 18 15 12 9 6"></polyline>
  </svg>
</button>

<script>
  const IS_MOBILE = /Android|iPhone|iPad|iPod/.test(navigator.userAgent);
  const IMG_FOLDER = '../photo/';
  const stage = document.getElementById('stage');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('counter');
  const scrubber = document.getElementById('scrubber');
  
  let pages = [];
  let current = 0;

  async function loadPages(){
    try {
      const response = await fetch(`${IMG_FOLDER}?a=${new Date().getTime()}`);
      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      const links = Array.from(doc.querySelectorAll('a[href]'))
        .map(a => a.getAttribute('href'))
        .filter(h => /\.(jpg|jpeg|png|webp|gif)$/i.test(h));

      if(links.length === 0){
        stage.innerHTML = '<div class="loading">Aucune photo trouvée.</div>';
        return;
      }

      pages = links.map(name => ({ name }));
      stage.innerHTML = '<img id="pageImg" src="" alt="">';
      buildScrubber();
      showPage(0);
    }catch(err){
      stage.innerHTML = '<div class="loading">Erreur de chargement.</div>';
      console.error(err);
    }
  }

  function showPage(i){
    current = Math.max(0, Math.min(i, pages.length - 1));
    const img = document.getElementById('pageImg');
    const file = pages[current];
    const src = IMG_FOLDER + encodeURIComponent(file.name);

    img.classList.remove('show');
    const swap = () => {
      img.src = src;
      img.onload = () => {
        img.classList.add('show');
        if(IS_MOBILE){
          const imgRatio = img.naturalHeight / img.naturalWidth;
          img.classList.toggle('portrait-contain', imgRatio > 1.3);
        }
      };
    };
    setTimeout(swap, 150);

    counter.textContent = (current + 1) + ' / ' + pages.length;
    prevBtn.disabled = current === 0;
    updateScrubberActive();
  }

  function goNext(){
    if(current >= pages.length - 1){
      window.location.href = '../';
    } else {
      showPage(current + 1);
    }
  }

  prevBtn.addEventListener('click', () => showPage(current - 1));
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('click', (e) => {
    if (e.target.closest('a') || e.target.closest('.arrow') || e.target.closest('.counter') || e.target.closest('.scrubber')) return;
    const isLeft = e.clientX < window.innerWidth / 2;
    isLeft ? showPage(current - 1) : goNext();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') showPage(current - 1);
    if(e.key === 'ArrowRight') goNext();
  });

  let touchStartX = null;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50) dx > 0 ? showPage(current - 1) : goNext();
    touchStartX = null;
  }, {passive:true});

  loadPages();

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  let scrubTimeout = null;
  let dragging = false;
  let dragStartX = 0;
  let dragStartScroll = 0;

  function buildScrubber(){
    const frag = document.createDocumentFragment();
    const padStart = document.createElement('span');
    padStart.className = 'pad';
    frag.appendChild(padStart);
    pages.forEach((p, idx) => {
      const el = document.createElement('span');
      el.className = 'num';
      el.textContent = idx + 1;
      el.dataset.idx = idx;
      frag.appendChild(el);
    });
    const padEnd = document.createElement('span');
    padEnd.className = 'pad';
    frag.appendChild(padEnd);
    scrubber.innerHTML = '';
    scrubber.appendChild(frag);
  }

  function updateScrubberActive(){
    scrubber.querySelectorAll('.num').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.idx) === current);
    });
    if(scrubber.classList.contains('open') && !dragging) scrollActiveIntoView(false);
  }

  function scrollActiveIntoView(smooth){
    const active = scrubber.querySelector('.num.active');
    if(active) active.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', inline: 'center', block: 'nearest' });
  }

  counter.addEventListener('click', (e) => {
    e.stopPropagation();
    openScrubber(!scrubber.classList.contains('open'));
  });

  const counterWrap = document.getElementById('counterWrap');
  counterWrap.addEventListener('mouseenter', () => openScrubber(true));
  counterWrap.addEventListener('mouseleave', () => { if(!dragging) openScrubber(false); });

  function openScrubber(open){
    scrubber.classList.toggle('open', open);
    counter.classList.toggle('hidden', open);
    if(open) scrollActiveIntoView(false);
  }

  scrubber.addEventListener('mousedown', (e) => {
    dragging = true;
    scrubber.classList.add('dragging');
    dragStartX = e.clientX;
    dragStartScroll = scrubber.scrollLeft;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    scrubber.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
  });
  window.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    scrubber.classList.remove('dragging');
  });

  scrubber.addEventListener('click', (e) => {
    e.stopPropagation();
    const num = e.target.closest('.num');
    if(num) showPage(Number(num.dataset.idx));
  });

  scrubber.addEventListener('scroll', () => {
    clearTimeout(scrubTimeout);
    scrubTimeout = setTimeout(() => {
      const rect = scrubber.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      let closest = null, closestDist = Infinity;
      scrubber.querySelectorAll('.num').forEach(el => {
        const r = el.getBoundingClientRect();
        const dist = Math.abs((r.left + r.width/2) - centerX);
        if(dist < closestDist){ closestDist = dist; closest = el; }
      });
      if(closest){
        const idx = Number(closest.dataset.idx);
        if(idx !== current) showPage(idx);
      }
    }, 120);
  }, { passive:true });
</script>

<script src="/image-protection.js"></script>
</body>
</html>
