<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Test vidéo</title>
<style>body{margin:16px;font:14px/1.4 -apple-system,sans-serif;background:#fff;color:#111}h2{font-size:15px;margin:20px 0 6px}video{display:block;width:420px;max-width:100%;background:#c33}pre{white-space:pre-wrap;background:#eee;padding:8px;margin:6px 0 0}</style></head>
<body><h1 style="font-size:18px">Test vidéo (sans son)</h1>
<p>Fond rouge = la vidéo n'affiche rien. Faites une capture de toute cette page au bout de 10 secondes.</p>
<h2>A. Teaser</h2><video muted loop playsinline autoplay controls src="images/teaser2.mov?v=2"></video><pre></pre>
<h2>B. Mirror</h2><video muted loop playsinline autoplay controls src="images/mirror.mov?v=4"></video><pre></pre>
<pre id="n"></pre>
<script>
document.getElementById('n').textContent=navigator.userAgent;
const vs=[...document.querySelectorAll('video')];
function maj(){vs.forEach(v=>{let lum='?';try{const c=document.createElement('canvas');c.width=16;c.height=9;const g=c.getContext('2d');g.drawImage(v,0,0,16,9);const a=g.getImageData(0,0,16,9).data;let s=0;for(let i=0;i<a.length;i+=4)s+=a[i]+a[i+1]+a[i+2];lum=Math.round(s/(a.length/4)/3)}catch(e){lum=e.name}
v.nextElementSibling.textContent='temps '+v.currentTime.toFixed(1)+' | '+(v.paused?'en pause':'en lecture')+' | prête '+v.readyState+' | réseau '+v.networkState+' | taille '+v.videoWidth+'x'+v.videoHeight+' | image '+lum+(v.error?' | ERREUR '+v.error.code+' '+v.error.message:'')})}
vs.forEach(v=>{const p=v.play();if(p)p.catch(e=>{v.dataset.e=e.name})});setInterval(maj,500);maj();
</script></body></html>
